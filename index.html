<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Memory Pair Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:12px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 0%,#263d8b,#090e28 42%,#03050d 100%)}
#app{width:min(920px,100%);padding:18px;border:1px solid #3bdcff;border-radius:26px;background:rgba(5,10,28,.96);box-shadow:0 0 45px rgba(35,210,255,.2)}
h1{text-align:center;margin:0;font-size:clamp(32px,7vw,58px);letter-spacing:2px;text-shadow:0 0 20px #3bdcff}
.sub{text-align:center;color:#a5eaff;margin:4px 0 18px}
#form{max-width:520px;margin:auto}
input{width:100%;padding:14px;margin:7px 0;border-radius:13px;border:1px solid #41648e;background:#0c1735;color:#fff;font-size:16px}
button{border:0;border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer}
#start,#restart{width:100%;margin-top:10px;background:linear-gradient(135deg,#35e5ff,#6d9cff);color:#04101b;font-size:18px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.hud .box{padding:9px;border:1px solid #2d557e;border-radius:13px;background:#101d40;text-align:center}
.hud b{display:block;color:#72eaff;font-size:21px;margin-top:2px}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:auto}
.card{aspect-ratio:1/1;border:0;padding:0;background:transparent;perspective:700px;cursor:pointer}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .38s}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.back{background:linear-gradient(145deg,#1c3c78,#0b1738);border:2px solid #4d79ae;font-size:clamp(28px,6vw,45px);box-shadow:inset 0 0 24px rgba(60,190,255,.12)}
.front{transform:rotateY(180deg);background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.2),transparent 22%),linear-gradient(145deg,#152f62,#0c1735);border:2px solid #53ddff;font-size:clamp(30px,7vw,54px)}
.matched .front{border-color:#61ffad;box-shadow:0 0 22px rgba(80,255,160,.18)}
#message{text-align:center;min-height:30px;margin:12px 0;font-weight:900}
#gameover{display:none;text-align:center;padding:18px}
#finalScore{font-size:62px;color:#71eaff;font-weight:1000}
#stats{color:#a7c4e4;margin:8px 0 15px}
@media(max-width:600px){
 body{padding:6px}
 #app{padding:12px;border-radius:19px}
 .hud{grid-template-columns:repeat(2,1fr)}
 #board{gap:7px}
 .face{border-radius:12px}
}
</style>
</head>
<body>
<div id="app">
<h1>🃏 MEMORY PAIR</h1>
<div class="sub">ARCADE • MATCH • COMBO</div>

<div id="form">
<input id="name" maxlength="40" placeholder="NAMA MURID">
<input id="school" maxlength="60" placeholder="NAMA SEKOLAH">
<button id="start">🚀 START GAME</button>
</div>

<div id="play" style="display:none">
<div class="hud">
 <div class="box">LEVEL<b id="level">1</b></div>
 <div class="box">SKOR<b id="score">0</b></div>
 <div class="box">COMBO<b id="combo">0</b></div>
 <div class="box">⏱️ MASA<b id="time">45</b></div>
</div>
<div id="board"></div>
<div id="message">Cari pasangan yang sama!</div>
</div>

<div id="gameover">
<h2>🏆 GAME OVER</h2>
<div>SKOR AKHIR</div>
<div id="finalScore">0</div>
<div id="stats"></div>
<button id="restart">🔄 MAIN SEMULA</button>
</div>
</div>

<script>
(()=>{
const icons=["🚀","👾","💎","⚡","🔥","⭐","🎮","🪐","🍕","🏎️","🎯","👑","💣","🛸","🍔","🎲","🏆","🎧","🧸","💰"];
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyg9PDS6SW3Dq2Scu8znUiS5oVcAHeZjJs41e1uG8NGN308PfIhwSFkXD-tqWXXUEW-/exec";
let name="",school="",level=1,score=0,combo=0,bestCombo=0,time=45,timer=null,first=null,second=null,lock=false,active=false;
const $=id=>document.getElementById(id),board=$("board");
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pairsForLevel(){return Math.min(10,3+Math.ceil(level/1.4))}
function start(){
 name=$("name").value.trim();school=$("school").value.trim();
 if(!name||!school){alert("Sila masukkan nama murid dan nama sekolah.");return}
 level=1;score=0;combo=0;bestCombo=0;active=true;
 $("form").style.display="none";$("gameover").style.display="none";$("play").style.display="block";
 makeLevel();startTimer();
}
function makeLevel(){
 clearInterval(timer);first=null;second=null;lock=false;
 const count=pairsForLevel(), chosen=shuffle(icons).slice(0,count), deck=shuffle([...chosen,...chosen]);
 time=Math.max(14,48-level*3);
 $("level").textContent=level;$("score").textContent=score;$("combo").textContent=combo;$("time").textContent=time;
 board.style.gridTemplateColumns=count>=7?"repeat(5,1fr)":"repeat(4,1fr)";
 board.innerHTML="";
 deck.forEach((icon,i)=>{
   const c=document.createElement("button");c.className="card";c.type="button";c.dataset.icon=icon;c.dataset.index=i;
   c.innerHTML='<div class="card-inner"><div class="face back">❓</div><div class="face front">'+icon+'</div></div>';
   c.addEventListener("click",()=>flip(c));board.appendChild(c);
 });
 $("message").textContent="Cari semua pasangan!";
 startTimer();
}
function flip(card){
 if(!active||lock||card.classList.contains("flipped")||card.classList.contains("matched"))return;
 card.classList.add("flipped");
 if(!first){first=card;return}
 second=card;lock=true;
 setTimeout(checkPair,430);
}
function checkPair(){
 if(!first||!second)return;
 if(first.dataset.icon===second.dataset.icon){
   first.classList.add("matched");second.classList.add("matched");
   combo++;bestCombo=Math.max(bestCombo,combo);
   const pts=100+(combo-1)*30+level*15;score+=pts;
   $("score").textContent=score;$("combo").textContent=combo;
   $("message").textContent=combo>=3?"🔥 COMBO ×"+combo+"! +"+pts:"✅ PAIR! +"+pts;
   first=null;second=null;lock=false;
   if(!board.querySelector(".card:not(.matched)")){
     if(level>=10){finish(true);return}
     level++;setTimeout(makeLevel,650);
   }
 }else{
   combo=0;$("combo").textContent=0;
   $("message").textContent="❌ BUKAN PAIR!";
   setTimeout(()=>{first.classList.remove("flipped");second.classList.remove("flipped");first=null;second=null;lock=false},650);
 }
}
function startTimer(){
 clearInterval(timer);timer=setInterval(()=>{
   if(!active)return;
   time--;$("time").textContent=time;
   if(time<=0)finish(false);
 },1000);
}
function saveScore(){
 if(!SCRIPT_URL || SCRIPT_URL.includes("PASTE_APPS_SCRIPT_URL_HERE")) return;
 const data=new URLSearchParams({nama:name,sekolah:school,skor:String(score)});
 fetch(SCRIPT_URL,{method:"POST",body:data,mode:"no-cors"}).catch(()=>{});
}
function finish(completed){
 active=false;clearInterval(timer);saveScore();$("play").style.display="none";$("gameover").style.display="block";
 $("finalScore").textContent=score;
 $("stats").textContent=(completed?"🏆 SEMUA 10 LEVEL SELESAI":"⏱️ MASA TAMAT")+" • BEST COMBO ×"+bestCombo;
}
$("start").addEventListener("click",start);
$("restart").addEventListener("click",()=>{$("gameover").style.display="none";$("form").style.display="block";$("name").value=name;$("school").value=school});
})();
</script>
</body>
</html>
