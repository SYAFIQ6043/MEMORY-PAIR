<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Pair Arcade — Leaderboard</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#182b68,#070b20 65%);color:#fff;padding:28px 14px}.wrap{max-width:900px;margin:auto}h1{text-align:center;font-size:clamp(30px,6vw,58px);margin:10px 0 4px;font-weight:900;color:#ffd83d;text-shadow:0 4px 0 #8b4b00,0 0 25px #00cfff}.sub{text-align:center;color:#9fefff;margin-bottom:24px}.card{background:rgba(8,16,48,.88);border:2px solid #18d9ff;border-radius:22px;padding:14px;box-shadow:0 0 30px rgba(0,210,255,.25)}table{width:100%;border-collapse:collapse}th{background:#0c2e66;color:#6feaff;padding:14px 8px;font-size:15px}td{padding:14px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.12);font-size:16px}tr:nth-child(1) td{color:#ffd83d;font-weight:900;font-size:20px}tr:nth-child(2) td{color:#dce7ff;font-weight:800}tr:nth-child(3) td{color:#ffb27a;font-weight:800}.rank{font-weight:900}.status{text-align:center;margin:14px 0;color:#8feaff;font-size:13px}@media(max-width:600px){th,td{padding:11px 4px;font-size:13px}td:nth-child(3){max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}</style></head>
<body><div class="wrap"><h1>🧠 MEMORY PAIR</h1><div class="sub">🏆 ARCADE LEADERBOARD</div><div class="card"><table><thead><tr><th>RANK</th><th>NAMA</th><th>SEKOLAH</th><th>SKOR</th></tr></thead><tbody id="board"><tr><td colspan="4">Memuatkan skor...</td></tr></tbody></table></div><div class="status" id="status">Menghubungi Google Sheets...</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzZam4vRbivhAWJPY3oLjG3cZ3ftqriitlVmn6TpaO4SC7gloR57pPISBD60gKmGpdq/exec';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function show(data){const rows=Array.isArray(data.scores)?data.scores:[];const b=document.getElementById('board');b.innerHTML=rows.length?rows.map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(x.nama)}</td><td>${esc(x.sekolah)}</td><td><b>${Number(x.skor)||0}</b></td></tr>`).join(''):'<tr><td colspan="4">Belum ada rekod skor.</td></tr>';document.getElementById('status').textContent='Dikemas kini: '+new Date().toLocaleTimeString('ms-MY');}
function load(){const cb='memoryPairCB_'+Date.now();window[cb]=show;const s=document.createElement('script');s.src=API+'?callback='+cb+'&t='+Date.now();s.onerror=()=>document.getElementById('status').textContent='Gagal membaca Google Sheets. Semak URL Apps Script.';s.onload=()=>setTimeout(()=>{try{delete window[cb]}catch(e){}s.remove()},1000);document.body.appendChild(s);}load();setInterval(load,5000);
</script></body></html>
